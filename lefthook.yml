glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    lint-and-format-ts:
      glob: "src/**/*.{ts,tsx}"
      run: npx eslint --fix {staged_files} && npx prettier --write {staged_files}
      stage_fixed: true
    lint-and-format-md:
      glob: "**/*.md"
      exclude: "(^\\.|/\\.|node_modules|dist|release)"
      run: npx markdownlint --fix {staged_files} && npx prettier --write {staged_files}
      stage_fixed: true
    format-other:
      glob: "src/**/*.{js,json,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true


